packages:
  # Desktop-owned product packages. The legacy monorepo lives frozen under
  # legacy/ and is deliberately NOT a workspace member: ordinary install,
  # build, and packaging must never read its package graph.
  - apps/*
  - packages/*

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). esbuild's postinstall validates its native binary;
# electron 43.x currently ships no install script (its binary downloads lazily on
# first run), and its entry is kept as a forward guard in case a future version
# reintroduces one. Everything else is denied by default.
allowBuilds:
  esbuild: true
  electron: true
