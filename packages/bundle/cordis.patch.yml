# Desktop keeps the official base and Web trees, replaces browser-owned startup,
# and mounts desktop capability providers through Cordis.
- id: web-startup
  disabled: true
- id: webserver
  disabled: true
- id: web-runtime
  disabled: true
- id: client-hmr
  disabled: true
- id: directory-picker
  disabled: true
- id: connection
  disabled: true
# The official gateway spawns native open commands inside the DSH child; the
# desktop product hands paths to Electron main instead (one ApiProxy over the
# official factory with only the opener injected).
- id: api-gateway
  disabled: true
- insert:
    - id: desktop-directory-picker
      name: '@dsh-desktop/native'
    - id: desktop-api-gateway
      name: '@dsh-desktop/native/gateway'
    - id: desktop-connection
      name: '@dsh-desktop/connection'
    # The official renderless native client consumes the desktop Host picker
    # through the unchanged workspaces.pickDirectory contract.
    - id: desktop-directory-picker-client
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
    - id: desktop-ui
      name: '@dsh-desktop/ui'
