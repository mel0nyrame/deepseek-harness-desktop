# Desktop reuses the Web product composition but replaces every browser
# transport/runtime row with one child-process IPC carrier.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

# The auto picker resolves browse vs. native from the Web server; without one
# it can never settle. The desktop runtime itself provides the native
# directoryPicker through its reverse Electron-main request owner, while this
# renderless client half keeps the existing workspace flow.
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-native-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

- id: connection
  inject: []
  config:
    trustedHosts: []

- insert:
    - id: desktop-runtime
      name: '@deepseek-ai/dsh-desktop-app'
