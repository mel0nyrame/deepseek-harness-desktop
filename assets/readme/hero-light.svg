<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DSH Desktop</title>
  <desc id="desc">DeepSeek Harness packaged as a native Electron application with a bundled runtime and private desktop carrier.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF3FE"/>
    </linearGradient>
    <linearGradient id="runtime-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EDFD"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="32" fill="url(#hero-bg)" stroke="#E1E5EE" stroke-width="2"/>

  <g id="title-block" transform="translate(64 52)">
    <rect width="282" height="38" rx="19" fill="#E4EDFD"/>
    <circle cx="20" cy="19" r="6" fill="#4176E6"/>
    <text x="36" y="25" fill="#0E3074" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.2">DEEPSEEK HARNESS · DESKTOP</text>

    <text x="0" y="123" fill="#0F1115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-2.5">DSH Desktop</text>
    <text x="0" y="169" fill="#353638" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="500">The full DSH runtime, inside a native Electron app.</text>
    <text x="0" y="207" fill="#61666B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Local sessions, tools, plugins, PTYs, and native workspace actions.</text>

    <g transform="translate(0 255)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="650">
      <rect width="166" height="42" rx="21" fill="#FFFFFF" stroke="#CFD3DA"/>
      <circle cx="20" cy="21" r="5" fill="#4176E6"/>
      <text x="34" y="27" fill="#0F1115">BUNDLED DSH</text>
      <rect x="180" width="164" height="42" rx="21" fill="#FFFFFF" stroke="#CFD3DA"/>
      <circle cx="200" cy="21" r="5" fill="#679EFE"/>
      <text x="214" y="27" fill="#0F1115">PRIVATE IPC</text>
      <rect x="358" width="174" height="42" rx="21" fill="#FFFFFF" stroke="#CFD3DA"/>
      <circle cx="378" cy="21" r="5" fill="#28C840"/>
      <text x="392" y="27" fill="#0F1115">NATIVE MACOS</text>
    </g>
  </g>

  <g id="desktop-window" transform="translate(760 46)">
    <rect x="10" y="14" width="370" height="316" rx="28" fill="#0F1115" opacity="0.08"/>
    <rect width="370" height="316" rx="28" fill="#FFFFFF" stroke="#CFD3DA" stroke-width="2"/>
    <path d="M0 58H370" stroke="#E1E5EE" stroke-width="2"/>
    <circle cx="26" cy="29" r="7" fill="#FF5F57"/>
    <circle cx="49" cy="29" r="7" fill="#FEBC2E"/>
    <circle cx="72" cy="29" r="7" fill="#28C840"/>
    <text x="260" y="37" fill="#81858C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">dsh://app</text>

    <rect x="20" y="78" width="74" height="216" rx="20" fill="#F9FAFB"/>
    <rect x="38" y="100" width="38" height="8" rx="4" fill="#4176E6"/>
    <rect x="38" y="127" width="28" height="7" rx="3.5" fill="#CFD3DA"/>
    <rect x="38" y="150" width="38" height="7" rx="3.5" fill="#CFD3DA"/>
    <rect x="38" y="173" width="32" height="7" rx="3.5" fill="#CFD3DA"/>
    <circle cx="57" cy="261" r="14" fill="#E4EDFD"/>

    <g transform="translate(120 88)">
      <rect width="222" height="190" rx="24" fill="#F9FAFB" stroke="#E1E5EE"/>
      <text x="24" y="35" fill="#61666B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">BUNDLED RUNTIME</text>
      <rect x="39" y="58" width="144" height="92" rx="28" fill="url(#runtime-fill)" stroke="#0F1115" stroke-width="2"/>
      <rect x="61" y="79" width="100" height="20" rx="10" fill="#FFFFFF" stroke="#679EFE"/>
      <rect x="61" y="102" width="100" height="20" rx="10" fill="#4176E6"/>
      <rect x="61" y="125" width="100" height="20" rx="10" fill="#FFFFFF" stroke="#679EFE"/>
      <path d="M176 102H204" stroke="#4176E6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="205" cy="102" r="8" fill="#4176E6"/>
      <path d="M105 169C98 158 87 158 80 163C87 166 92 173 105 177C118 173 123 166 130 163C123 158 112 158 105 169Z" fill="#4176E6"/>
    </g>
  </g>
</svg>
