      <text x="22" y="105" fill="#0F1115" font-size="25" font-weight="700">Electron main</text>
      <text x="22" y="138" fill="#61666B" font-size="19">Native actions + window</text>
      <text x="22" y="168" fill="#61666B" font-size="19">Lifecycle supervision</text>
    </g>

    <path d="M886 153H918" stroke="#4176E6" stroke-width="4" stroke-linecap="round"/>
    <path d="M909 143L919 153L909 163" fill="none" stroke="#4176E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

