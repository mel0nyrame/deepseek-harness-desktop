      <path d="M35 58H58" stroke="#4176E6" stroke-width="4" stroke-linecap="round"/>
      <text x="22" y="105" fill="#0F1115" font-size="25" font-weight="700">Preload bridge</text>
      <text x="22" y="138" fill="#61666B" font-size="19">Context isolated</text>
      <text x="22" y="168" fill="#61666B" font-size="19">Narrow validated API</text>
    </g>

    <path d="M592 153H624" stroke="#4176E6" stroke-width="4" stroke-linecap="round"/>
    <path d="M615 143L625 153L615 163" fill="none" stroke="#4176E6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

