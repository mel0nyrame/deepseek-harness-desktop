      <text x="22" y="105" fill="#0F1115" font-size="25" font-weight="700">React renderer</text>
      <text x="22" y="138" fill="#61666B" font-size="19">Existing Connection API</text>
      <text x="22" y="168" fill="#61666B" font-size="19">Local dsh://app assets</text>
    </g>

    <path d="M298 153H330" stroke="#4176E6" stroke-width="4" stroke-linecap="round"/>
