<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DSH Desktop architecture</title>
  <desc id="desc">The React renderer crosses a narrow preload bridge into Electron main, which supervises a bundled DeepSeek Harness child process.</desc>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="#F9FAFB" stroke="#E1E5EE" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
