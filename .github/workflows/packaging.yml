name: Packaging

# Packaging gate: runs when the app artifact could change. Ordinary
# pull-request checks stay in ci.yml; this workflow re-verifies the real
# installable product (runtime closure, macOS package creation, installed-app
# smoke outside the source tree) whenever packaging inputs move, and on every
# push to the default branch so the promoted state always has artifact
# evidence.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'patches/**'
      - 'tests/fixtures/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/packaging.yml'
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  package-macos:
    runs-on: macos-15
    name: packaged macOS application
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build and verify installable products
        # electron-builder seals and signs the ~30k-file embedded runtime; the
        # runner's default soft fd limit sits below the signing concurrency
        # peak and flakes the gate with EMFILE. Raise the soft limit toward
        # 65536, falling back to this host's hard ceiling.
        run: |
          ulimit -Sn 65536 2>/dev/null || ulimit -Sn "$(ulimit -Hn)" 2>/dev/null || true
          pnpm run package

      - name: Test installed application outside the source tree
        env:
          DSH_DESKTOP_PACKAGE_REQUIRED: '1'
        run: pnpm run test:package

      - uses: actions/upload-artifact@v6
        with:
          name: dsh-desktop-macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
