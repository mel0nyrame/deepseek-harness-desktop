name: CI

on:
  pull_request:
  push:

# Pull request runs are cheap and superseded quickly; cancel in-progress runs
# when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  workspace:
    runs-on: ubuntu-latest
    name: workspace checks
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test (incl. repository-layout boundary)
        run: pnpm run test

  package-macos:
    runs-on: macos-15
    name: packaged macOS application
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build and verify installable products
        # electron-builder seals and signs the ~30k-file embedded runtime; the
        # runner's default soft fd limit sits below the signing concurrency
        # peak and flakes the gate with EMFILE. Raise the soft limit toward
        # 65536, falling back to this host's hard ceiling.
        run: |
          ulimit -Sn 65536 2>/dev/null || ulimit -Sn "$(ulimit -Hn)" 2>/dev/null || true
          pnpm run package

      - name: Test installed application outside the source tree
        env:
          DSH_DESKTOP_PACKAGE_REQUIRED: '1'
        run: pnpm run test:package

      - uses: actions/upload-artifact@v6
        with:
          name: dsh-desktop-macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
