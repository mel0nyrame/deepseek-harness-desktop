# Release-grade desktop artifacts: build, ad-hoc sign, verify, smoke-test,
# and upload the macOS dmg for both architectures. This is a v* tag-only
# release path that produces both the x64 and arm64 artifacts an arm64
# development machine cannot build alone: the packaging script rebuilds
# node-pty against the host architecture, so x64 needs an Intel runner.
#
# Trigger: v* tags only. Ad-hoc signing needs no secrets; when a Developer
# ID certificate arrives, fill the identity/notarize wiring documented in
# apps/desktop/electron-builder.yml and the packaging pipeline's signature
# verification extends to the produced signature.
name: Desktop release artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # upload-artifact needs the actions scope; the restrictive block resets
  # everything else to none, which is the intent for this matrix.
  actions: write

env:
  PRIMARY_NODE_VERSION: '24'
  # Release runs must never report to the production telemetry endpoint
  # baked into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  desktop-artifacts:
    name: desktop ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: macos-26
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Builds, stages, ad-hoc signs, and verifies (codesign + Gatekeeper +
      # hdiutil) the .app and dmg for the runner's host architecture.
      - name: Package the desktop application
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:skip-build

      # arm64 runs the full packaged-app suite against the workspace .app:
      # the GUI first-paint and frame-recording assertions need local-disk
      # performance, and the M-series runner completes them in minutes. The
      # x64 leg runs only the artifact gate and the keyless scenario: the
      # Intel runner's VM focus choreography hangs the GUI journeys (the
      # acceptance journey stopped after "Host phase: running" twice), and
      # the keyless scenario is exactly the release criterion the installed
      # x64 artifact must prove — bundled Host start, Session creation, the
      # terminal-backed turn with ordered output, and quiescent quit.
      - name: Run the full packaged-app smoke (arm64)
        if: matrix.arch == 'arm64'
        env:
          DSH_DESKTOP_SMOKE_REQUIRED: '1'
        run: pnpm exec vitest run --config vitest.e2e.config.ts apps/desktop/tests/packaged-smoke.e2e.ts

      - name: Run the artifact gate and keyless smoke (x64)
        if: matrix.arch == 'x64'
        env:
          DSH_DESKTOP_SMOKE_REQUIRED: '1'
        run: pnpm exec vitest run --config vitest.e2e.config.ts apps/desktop/tests/packaged-smoke.e2e.ts -t 'has a packaged application when the gate requires it|runs the keyless interaction-parity scenario'

      # The mount-launch evidence the release criteria require: the artifact
      # mounted from the produced dmg must verify and pass the keyless
      # interaction-parity scenario. Only that scenario runs from the image —
      # first-paint timing assertions flake off a read-only HFS mount.
      - name: Mount the dmg and run the keyless packaged-app smoke
        env:
          DSH_DESKTOP_SMOKE_REQUIRED: '1'
        run: |
          dmg="$(ls apps/desktop/dist/*.dmg | head -1)"
          mount="$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/.*' | head -1)"
          echo "DSH_DESKTOP_DMG_MOUNT=$mount" >> "$GITHUB_ENV"
          codesign --verify --deep --strict "$mount/DSH Desktop.app"
          DSH_DESKTOP_APP_DIR="$mount/DSH Desktop.app" pnpm exec vitest run --config vitest.e2e.config.ts apps/desktop/tests/packaged-smoke.e2e.ts -t 'runs the keyless interaction-parity scenario'

      - name: Detach the dmg
        if: always()
        run: |
          if [ -n "$DSH_DESKTOP_DMG_MOUNT" ]; then hdiutil detach "$DSH_DESKTOP_DMG_MOUNT" || true; fi

      - name: Upload the dmg
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.arch }}-dmg
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
