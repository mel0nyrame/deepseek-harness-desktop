<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>DeepSeek Harness Desktop</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      body { min-height: 100vh; margin: 0; display: grid; place-content: center; gap: 20px; background: #090d18; color: #e9efff; }
      main { width: min(680px, calc(100vw - 64px)); padding: 36px; border: 1px solid #263451; border-radius: 18px; background: #11192a; box-shadow: 0 20px 80px #0008; }
      h1 { margin: 0 0 24px; font: 600 22px/1.3 system-ui, sans-serif; }
      pre { min-height: 64px; margin: 0; padding: 20px; border-radius: 12px; background: #080c15; color: #8ef0b1; font-size: 18px; line-height: 1.8; white-space: pre-wrap; }
    </style>
  </head>
  <body data-state="starting">
    <main>
      <h1 id="status">Starting integrated runtime…</h1>
      <pre id="result">Waiting for the desktop profile</pre>
    </main>
    <script type="module" src="./lib/renderer.js"></script>
  </body>
</html>
