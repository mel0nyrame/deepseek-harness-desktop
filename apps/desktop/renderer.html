<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>DeepSeek Harness Desktop</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090d18;
        color: #e9efff;
      }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 1rem; font-size: 1.35rem; font-weight: 600; }
      p { font-size: 1rem; line-height: 1.5; }
      pre {
        max-height: 12rem;
        margin: 1rem 0 0;
        padding: 0.75rem;
        overflow: auto;
        border-radius: 0.5rem;
        background: #080c15;
        color: #8ef0b1;
        font: 0.9rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: left;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body data-state="starting">
    <main role="status">
      <h1>DeepSeek Harness</h1>
      <p id="status">Starting the bundled DSH runtime…</p>
      <pre id="result" hidden></pre>
    </main>
    <script type="module" src="./lib/renderer.js"></script>
  </body>
</html>
