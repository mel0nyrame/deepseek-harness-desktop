name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: desktop-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  resolve:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release tag
        id: release
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)))*)?'
          if [[ ! "$TAG" =~ ^v${semver}$ ]]; then
            echo "::error::Release tag must be v<major>.<minor>.<patch> with an optional semver prerelease; got $TAG"
            exit 1
          fi
          if [ "$(git rev-list -n 1 "$TAG")" != "$HEAD_SHA" ]; then
            echo "::error::Release tag $TAG does not point at the CI-verified commit $HEAD_SHA"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

  notes:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the CI-tested release commit
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out release tag does not match CI-tested commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Select the bilingual release highlights
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          version="$VERSION"
          notes=".github/release-notes/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing bilingual release highlights: $notes"
            exit 1
          fi
          mkdir release-notes
          cp "$notes" release-notes/highlights.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes/highlights.md
          if-no-files-found: error

  dmg:
    needs: [resolve, notes]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: macos-26
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the CI-tested release commit
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out release tag does not match CI-tested commit $EXPECTED_SHA"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package the desktop application
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:skip-build

      - name: Run the full packaged-app smoke (arm64)
        if: matrix.arch == 'arm64'
        env:
          DSH_DESKTOP_SMOKE_REQUIRED: '1'
        run: pnpm exec vitest run --config vitest.e2e.config.ts apps/desktop/tests/packaged-smoke.e2e.ts

      - name: Run the artifact gate and keyless smoke (x64)
        if: matrix.arch == 'x64'
        env:
          DSH_DESKTOP_SMOKE_REQUIRED: '1'
        run: pnpm exec vitest run --config vitest.e2e.config.ts apps/desktop/tests/packaged-smoke.e2e.ts -t 'has a packaged application when the gate requires it|runs the keyless interaction-parity scenario'

      - name: Mount the dmg and run the keyless packaged-app smoke
        env:
          DSH_DESKTOP_SMOKE_REQUIRED: '1'
        run: |
          dmg="$(ls apps/desktop/dist/*.dmg | head -1)"
          mount="$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/.*' | head -1)"
          echo "DSH_DESKTOP_DMG_MOUNT=$mount" >> "$GITHUB_ENV"
          codesign --verify --deep --strict "$mount/DSH Desktop.app"
          DSH_DESKTOP_APP_DIR="$mount/DSH Desktop.app" pnpm exec vitest run --config vitest.e2e.config.ts apps/desktop/tests/packaged-smoke.e2e.ts -t 'runs the keyless interaction-parity scenario'

      - name: Detach the dmg
        if: always()
        run: |
          if [ -n "$DSH_DESKTOP_DMG_MOUNT" ]; then hdiutil detach "$DSH_DESKTOP_DMG_MOUNT" || true; fi

      - name: Prepare release assets
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          version="$VERSION"
          source="apps/desktop/dist/DSH Desktop-${version}-${{ matrix.arch }}.dmg"
          asset="DSH.Desktop-${version}-${{ matrix.arch }}.dmg"
          if [ ! -f "$source" ]; then
            echo "::error::Expected packaged DMG $source"
            exit 1
          fi
          mkdir release-assets
          cp "$source" "release-assets/$asset"
          (cd release-assets && shasum -a 256 "$asset" > "$asset.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.arch }}-release
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: [resolve, notes, dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the CI-tested release commit
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out release tag does not match CI-tested commit $EXPECTED_SHA"
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: release-notes

      - uses: actions/download-artifact@v5
        with:
          pattern: dsh-desktop-*-release
          path: release-assets
          merge-multiple: true

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="$TAG"
          version="$VERSION"
          prerelease="$PRERELEASE"
          assets=(
            "release-assets/DSH.Desktop-${version}-arm64.dmg"
            "release-assets/DSH.Desktop-${version}-arm64.dmg.sha256"
            "release-assets/DSH.Desktop-${version}-x64.dmg"
            "release-assets/DSH.Desktop-${version}-x64.dmg.sha256"
          )
          for asset in "${assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done

          verify_remote_tag() {
            object_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.type)"
            object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
            while [ "$object_type" = tag ]; do
              object_type="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq .object.type)"
              object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq .object.sha)"
            done
            if [ "$object_type" != commit ] || [ "$object_sha" != "$HEAD_SHA" ]; then
              echo "::error::Release tag $tag no longer points at CI-tested commit $HEAD_SHA"
              exit 1
            fi
          }

          verify_remote_tag
          generated="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$HEAD_SHA" --jq .body)"
          cp release-notes/highlights.md release-notes/body.md
          printf '\n\n%s\n' "$generated" >> release-notes/body.md

          if gh release view "$tag" >/dev/null 2>&1; then
            verify_remote_tag
            gh release edit "$tag" \
              --title "DSH Desktop v${version}" \
              --notes-file release-notes/body.md \
              --draft=false \
              --prerelease="$prerelease" \
              --verify-tag
            verify_remote_tag
            while IFS= read -r asset_id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].id')
            verify_remote_tag
            gh release upload "$tag" "${assets[@]}"
          else
            create_args=(
              "$tag"
              "${assets[@]}"
              --title "DSH Desktop v${version}"
              --notes-file release-notes/body.md
              --verify-tag
            )
            if [ "$prerelease" = true ]; then create_args+=(--prerelease); fi
            verify_remote_tag
            gh release create "${create_args[@]}"
          fi

  homebrew:
    needs: [resolve, release]
    if: needs.resolve.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Require the tap deploy key
        env:
          DSH_TAP_DEPLOY_KEY: ${{ secrets.DSH_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$DSH_TAP_DEPLOY_KEY" ]; then
            echo "::error::DSH_TAP_DEPLOY_KEY is required to update mel0nyrame/homebrew-dsh"
            exit 1
          fi

      - name: Verify the Homebrew tap is available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: mel0nyrame/homebrew-dsh
        run: |
          if ! gh api repos/mel0nyrame/homebrew-dsh >/dev/null; then
            echo "::error::Homebrew tap mel0nyrame/homebrew-dsh is unavailable"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          repository: mel0nyrame/homebrew-dsh
          ref: main
          path: homebrew-dsh
          ssh-key: ${{ secrets.DSH_TAP_DEPLOY_KEY }}

      - name: Update and push the stable cask
        working-directory: homebrew-dsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          version="$VERSION"
          ruby scripts/update-cask.rb "$version"
          if git diff --quiet; then
            echo "Homebrew cask already records $version"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/d/dsh-desktop.rb
          git commit -m "chore(cask): update dsh-desktop to ${version}"
          object_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)"
          object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          while [ "$object_type" = tag ]; do
            object_type="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq .object.type)"
            object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq .object.sha)"
          done
          if [ "$object_type" != commit ] || [ "$object_sha" != "$HEAD_SHA" ]; then
            echo "::error::Release tag $TAG no longer points at CI-tested commit $HEAD_SHA"
            exit 1
          fi
          git push origin HEAD:main
